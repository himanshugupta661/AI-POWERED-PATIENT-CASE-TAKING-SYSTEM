<svg width="500" height="380" viewBox="0 0 500 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="190" r="160" fill="#0284C7" fill-opacity="0.12"/>
  
  <!-- Digital Clinical Tablet -->
  <rect x="70" y="40" width="360" height="290" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="90" y="60" width="320" height="40" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <circle cx="110" cy="80" r="6" fill="#10B981"/>
  <rect x="130" y="74" width="120" height="12" rx="4" fill="#64748B"/>
  <rect x="330" y="74" width="60" height="12" rx="4" fill="#0284C7"/>

  <!-- Structured Intake Cards Inside Tablet -->
  <rect x="90" y="115" width="150" height="85" rx="8" fill="#0F172A" stroke="#334155"/>
  <rect x="105" y="130" width="80" height="10" rx="3" fill="#38BDF8"/>
  <rect x="105" y="150" width="120" height="6" rx="2" fill="#64748B"/>
  <rect x="105" y="162" width="100" height="6" rx="2" fill="#64748B"/>
  <rect x="105" y="174" width="70" height="6" rx="2" fill="#64748B"/>

  <rect x="260" y="115" width="150" height="85" rx="8" fill="#0F172A" stroke="#334155"/>
  <rect x="275" y="130" width="70" height="10" rx="3" fill="#34D399"/>
  <rect x="275" y="150" width="115" height="6" rx="2" fill="#64748B"/>
  <rect x="275" y="162" width="95" height="6" rx="2" fill="#64748B"/>
  <rect x="275" y="174" width="110" height="6" rx="2" fill="#64748B"/>

  <!-- Dynamic Waveform / Audio Input Indicator -->
  <rect x="90" y="215" width="320" height="95" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
  <circle cx="125" cy="262" r="18" fill="#0284C7" fill-opacity="0.2"/>
  <path d="M125 253V265M120 259H130" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 262C175 240 185 285 200 262C215 240 225 285 240 262C255 240 265 285 280 262C295 240 305 285 320 262C335 240 345 285 360 262" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="238" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Voice-Assisted Real-Time Medical Intake</text>
  
  <!-- Floating QR Code Badge -->
  <rect x="360" y="20" width="90" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="372" y="32" width="24" height="24" rx="3" fill="#0F172A"/>
  <rect x="414" y="32" width="24" height="24" rx="3" fill="#0F172A"/>
  <rect x="372" y="74" width="24" height="24" rx="3" fill="#0F172A"/>
  <rect x="418" y="74" width="8" height="8" fill="#0284C7"/>
  <rect x="428" y="84" width="10" height="10" fill="#0F172A"/>
</svg>
