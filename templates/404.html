{% extends "base.html" %}

{% block title %}404 - Page Not Found | PatientCase AI{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light p-3">
    <div class="card card-custom text-center p-5 max-w-500 shadow-sm">
        <div class="empty-state-icon text-primary mb-3">
            <i class="fa-solid fa-file-circle-question fa-2x"></i>
        </div>
        <h2 class="fw-bold mb-2">404 - Record Not Found</h2>
        <p class="text-muted mb-4">The medical page or case record you are looking for does not exist or may have been relocated.</p>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-primary-custom">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
