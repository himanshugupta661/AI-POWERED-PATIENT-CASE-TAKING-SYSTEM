{% extends "base.html" %}

{% block title %}Reset Password - PatientCase AI{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{{ url_for('index') }}" class="auth-brand">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="PatientCase AI" width="32" height="32">
                <span>PATIENTCASE</span> AI
            </a>
            <h3 class="fw-bold mt-2 mb-1">Account Recovery</h3>
            <p class="text-muted small">Enter your registered email address to receive access assistance</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="mb-4">
                <label class="form-label form-label-custom">Account Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control form-control-custom border-start-0" placeholder="name@example.com" required autofocus>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary-custom justify-content-center py-2">
                    <i class="fa-solid fa-paper-plane me-1"></i> Send Recovery Instructions
                </button>
            </div>
            
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="small text-decoration-none text-muted">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
